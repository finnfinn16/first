<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>番茄钟</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="drag"></div>
    <button class="icon-btn" id="pinBtn" title="置顶">📌</button>
    <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
    <button class="icon-btn close" id="closeBtn" title="关闭">✕</button>
  </header>

  <div class="mode" id="modeLabel">专注</div>

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
      <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"></circle>
    </svg>
    <div class="time" id="time">25:00</div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="ctrl-btn secondary" id="resetBtn" title="重置">↺</button>
    <button class="ctrl-btn primary" id="startBtn">开始</button>
    <button class="ctrl-btn secondary" id="skipBtn" title="跳过">⏭</button>
  </div>

  <div class="footer"><span id="todayCount">今日 🍅 × 0</span></div>

  <div class="settings" id="settingsPanel">
    <div class="settings-inner">
      <h2>设置 <button class="settings-close" id="settingsClose">✕</button></h2>
      <label>专注时长（分钟）<input type="number" id="workInput" min="1" max="120"></label>
      <label>短休息（分钟）<input type="number" id="shortInput" min="1" max="60"></label>
      <label>长休息（分钟）<input type="number" id="longInput" min="1" max="120"></label>
      <label>长休息间隔（次）<input type="number" id="intervalInput" min="1" max="12"></label>
      <label class="check"><input type="checkbox" id="autoNext"> 自动开始下一阶段</label>
      <button id="saveSettings">保存</button>
    </div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
